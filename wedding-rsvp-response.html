<html lang="en">

<meta charset="UTF-8">

  :root{
    --gold: #a8842f;
    --gold-deep: #8c6b1f;
    --gold-soft: #d9c184;
    --ink: #1c1a17;
    --paper: #ffffff;
    --paper-warm: #fdfcf9;
    --line: #e9e2cf;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: #000000;
    color: var(--ink);
    font-family: 'Montserrat', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .stage{
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 28px 14px;
  }

  .card{
    position: relative;
    width: 100%;
    max-width: 480px;
    background: var(--paper);
    padding: 3px;
  }

  .card::before{
    content:"";
    position:absolute;
    inset: 10px;
    border: 1px solid var(--ink);
    pointer-events:none;
  }

  .card-inner{
    position:relative;
    border: 2.5px solid var(--ink);
    padding: 40px 30px 34px;
    background: var(--paper);
    min-height: 480px;
    display:flex;
    flex-direction:column;
  }

  .ornament{
    text-align:center;
    color: var(--gold);
    font-size: 15px;
    letter-spacing: 6px;
    margin-bottom: 18px;
  }

  .eyebrow{
    text-align:center;
    font-family:'Montserrat', sans-serif;
    font-weight: 700;
    letter-spacing: 2.5px;
    font-size: 13px;
    color: var(--ink);
    text-transform: uppercase;
    margin: 0 0 6px;
  }

  .script-heading{
    text-align:center;
    font-family: 'Cinzel', serif;
    font-style: normal;
    font-weight: 600;
    color: var(--gold);
    line-height: 1.3;
    margin: 0;
  }

  .script-heading.small{
    font-size: 16px;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 4px;
  }

  .script-heading.big{
    font-family: 'Great Vibes', cursive;
    font-style: normal;
    font-weight: 400;
    font-size: 58px;
    letter-spacing: 0;
    margin-bottom: 22px;
  }

  .divider{
    width: 64px;
    height: 1px;
    background: var(--gold-soft);
    margin: 0 auto 22px;
  }

  .search-wrap{
    margin-top: 34px;
  }

  .search-label{
    text-align:center;
    font-size: 12px;
    letter-spacing: 1px;
    color: #6b6459;
    margin-bottom: 12px;
  }

  input[type="text"], textarea{
    font-family: 'Montserrat', sans-serif;
    width: 100%;
    border: 1.5px solid var(--line);
    background: var(--paper-warm);
    padding: 13px 14px;
    font-size: 14.5px;
    color: var(--ink);
    outline: none;
    transition: border-color .15s ease;
  }

  input[type="text"]:focus, textarea:focus{
    border-color: var(--gold);
  }

  .results{
    margin-top: 10px;
    max-height: 220px;
    overflow-y: auto;
  }

  .result-item{
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    font-size: 14px;
    display:flex;
    justify-content: space-between;
    align-items:center;
    transition: background .12s ease;
  }

  .result-item:hover{
    background: #faf6ea;
  }

  .result-item .tag{
    font-size: 10px;
    letter-spacing: .5px;
    color: var(--gold-deep);
    text-transform: uppercase;
    white-space: nowrap;
    margin-left: 10px;
  }

  .empty-note{
    text-align:center;
    font-size: 13px;
    color: #8a8378;
    margin-top: 16px;
    line-height: 1.6;
  }

  .greeting{
    text-align:center;
    margin-bottom: 26px;
  }

  .greeting .dear{
    font-family: 'Great Vibes', cursive;
    font-style: normal;
    font-weight: 400;
    color: var(--gold);
    font-size: 38px;
    line-height: 1.3;
  }

  .greeting .role-intro{
    margin-top: 14px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: .3px;
    color: var(--ink);
    line-height: 1.6;
  }

  .greeting .role{
    margin-top: 5px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink);
  }

  .greeting .role.ps{
    color: var(--gold-deep);
  }

  .greeting .invite-line{
    margin-top: 18px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 400;
    font-size: 13px;
    line-height: 1.8;
    color: var(--ink);
    padding: 0 6px;
  }

  .details{
    font-size: 13.5px;
    line-height: 1.85;
    color: var(--ink);
    margin-bottom: 26px;
  }

  .details .row{
    display:flex;
    justify-content: space-between;
    gap: 14px;
    padding: 7px 0;
    border-bottom: 1px dashed var(--line);
  }

  .details .label{
    font-weight: 700;
    letter-spacing: .4px;
    white-space: nowrap;
  }

  .details .value{
    text-align: right;
  }

  .section-title{
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold-deep);
    margin: 0 0 12px;
    text-align:center;

    display:flex;
    gap: 12px;
    margin-bottom: 26px;
  }

  .choice-box{
    flex:1;
    border: 1.5px solid var(--line);
    background: var(--paper-warm);
    padding: 16px 8px;
    text-align:center;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: .3px;
    cursor: pointer;
    transition: all .15s ease;
    user-select: none;
  }

  .choice-box:hover{
    border-color: var(--gold);
    background: #faf6ea;
    transform: translateY(-1px);
  }

  .choice-box.selected{
    border-color: var(--gold);
    background: var(--gold);
    color: #fff;
  }

  .transport-note{
    font-size: 11px;
    color: #8a8378;
    text-align:center;
    margin-bottom: 12px;
    font-style: italic;
  }

  .transport-choices{
    display:flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 26px;
  }

  .transport-box{
    border: 1.5px solid var(--line);
    background: var(--paper-warm);
    padding: 12px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s ease;
    display:flex;
    align-items:center;
    gap: 10px;
  }

  .transport-box:hover{
    border-color: var(--gold);
    background: #faf6ea;
  }

  .transport-box.selected{
    border-color: var(--gold);
    background: #fbf3df;
  }

  .radio-dot{
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 1.5px solid var(--gold-soft);
    flex-shrink:0;
    position:relative;
  }

  .transport-box.selected .radio-dot{
    border-color: var(--gold);
  }

  .transport-box.selected .radio-dot::after{
    content:"";
    position:absolute;
    inset: 3px;
    border-radius: 50%;
    background: var(--gold);
  }

  .note-section{
    margin-bottom: 26px;
  }

  textarea{
    resize: vertical;
    min-height: 80px;
    font-size: 13.5px;
  }

  .submit-btn{
    width: 100%;
    padding: 15px;
    background: var(--ink);
    color: #fff;
    border: none;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    letter-spacing: 1.5px;
    font-size: 12.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .15s ease;
    margin-top: auto;
  }

  .submit-btn:hover:not(:disabled){
    background: var(--gold-deep);
  }

  .submit-btn:disabled{
    background: #c9c3b6;
    cursor: not-allowed;
  }

  .back-link{
    text-align:center;
    margin-top: 16px;
    font-size: 11.5px;
    color: #8a8378;
    cursor: pointer;
    letter-spacing: .5px;
  }

  .back-link:hover{
    color: var(--gold-deep);
  }

  .center-screen{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    flex: 1;
    padding: 20px 0;
  }

  .center-screen .icon{
    font-size: 30px;
    color: var(--gold);
    margin-bottom: 16px;
    font-family: 'Playfair Display', serif;
    font-style: italic;
  }

  .center-screen h2{
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 700;
    color: var(--gold);
    font-size: 24px;
    margin: 0 0 12px;
  }

  .center-screen p{
    font-size: 13.5px;
    line-height: 1.8;
    color: var(--ink);
    max-width: 320px;
    margin: 0 auto;
  }

  .prev-answer{
    margin-top: 18px;
    padding: 12px 18px;
    border: 1px dashed var(--gold-soft);
    font-size: 12px;
    letter-spacing: .5px;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--gold-deep);
  }

  .error-text{
    color: #a33d3d;
    font-size: 11.5px;
    text-align:center;
    margin-top: -10px;
    margin-bottom: 14px;
    display:none;
  }

  ::-webkit-scrollbar{ width: 6px; }
  ::-webkit-scrollbar-thumb{ background: var(--gold-soft); }

  @media (max-width: 380px){
    .card-inner{ padding: 32px 20px 28px; }
    .script-heading.big{ font-size: 44px; }
    .rsvp-choices{ flex-direction: column; }
  }
</style>
</head>

      '<div class="section-title">Will You Be Joining Us?</div>' +
      '<div class="rsvp-choices">' +
        '<div class="choice-box' + (state.rsvpChoice === 'accept' ? ' selected' : '') + '" data-choice="accept">Joyfully<br>Accept</div>' +
        '<div class="choice-box' + (state.rsvpChoice === 'decline' ? ' selected' : '') + '" data-choice="decline">Respectfully<br>Decline</div>' +
      '</div>' +
      '<div class="error-text" id="rsvpError">Please select whether you will be joining us.</div>' +

      '<div class="section-title">Transportation <span style="text-transform:none;font-weight:500;">(optional)</span></div>' +
      '<div class="transport-note">Shuttle service runs from the church to the reception venue and back only.</div>' +
      '<div class="transport-choices">' +
        '<div class="transport-box' + (state.transportChoice === 'avail' ? ' selected' : '') + '" data-transport="avail"><span class="radio-dot"></span><span>I will avail the transportation service.</span></div>' +
        '<div class="transport-box' + (state.transportChoice === 'decline' ? ' selected' : '') + '" data-transport="decline"><span class="radio-dot"></span><span>I will not avail the transportation service.</span></div>' +
      '</div>' +

      '<div class="note-section">' +
        '<div class="section-title">Leave a Note to the Newlyweds</div>' +
        '<textarea id="noteInput" placeholder="Write your well wishes here... (optional)">' + esc(state.noteText) + '</textarea>' +
      '</div>' +

      '<button class="submit-btn" id="submitBtn">Submit RSVP</button>' +
      '<div class="back-link" id="backLink">&larr; Search a different name</div>';

    app.querySelectorAll('.choice-box').forEach(function(el){
      el.addEventListener('click', function(){
        state.rsvpChoice = el.getAttribute('data-choice');
        render();
      });
    });

    app.querySelectorAll('.transport-box').forEach(function(el){
      el.addEventListener('click', function(){
        var val = el.getAttribute('data-transport');
        state.transportChoice = (state.transportChoice === val) ? null : val;
        render();
      });
    });

    var noteInput = document.getElementById('noteInput');
    noteInput.addEventListener('input', function(e){
      state.noteText = e.target.value;
    });

    document.getElementById('backLink').addEventListener('click', function(){
      state.screen = 'search';
      state.selectedGuest = null;
      state.query = '';
      render();
    });

    document.getElementById('submitBtn').addEventListener('click', handleSubmit);
  }

  function handleSubmit(){
    if (!state.rsvpChoice){
      document.getElementById('rsvpError').style.display = 'block';
      return;
    }
    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    var guest = state.selectedGuest;
    var rsvpText = state.rsvpChoice === 'accept' ? 'Joyfully Accept' : 'Respectfully Decline';
    var transportText = state.transportChoice === 'avail'
      ? 'I will avail the transportation service'
      : (state.transportChoice === 'decline' ? 'I will not avail the transportation service' : '');

    var payload = {
      name: guest.name,
      role: guest.role,
      rsvp: rsvpText,
      transport: transportText,
      note: state.noteText,
      submittedAt: new Date().toISOString()
    };

    submitToGoogleForm(guest.name, rsvpText, transportText, state.noteText);
    storeResponse(guest.id, payload);

    state.priorAnswer = payload;
    state.screen = 'thankyou';
    render();
  }

  function submitToGoogleForm(name, rsvp, transport, note){
    var body = new URLSearchParams();
    body.append(ENTRY_NAME, name);
    body.append(ENTRY_RSVP, rsvp);
    body.append(ENTRY_TRANSPORT, transport);
    body.append(ENTRY_NOTE, note);

    fetch(FORM_ACTION, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body.toString()
    }).catch(function(){ /* no-cors: errors are expected to be opaque */ });
  }

  function renderAlready(){
    var guest = state.selectedGuest;
    var ans = state.priorAnswer;
    app.innerHTML =
      '<div class="center-screen">' +
        '<div class="icon">&#10022;</div>' +
        '<h2>You&rsquo;ve Already Responded</h2>' +
        '<p>Dear ' + esc(guest.name) + ', we&rsquo;ve already received your RSVP from this device. Responses cannot be edited once submitted.</p>' +
        '<div class="prev-answer">' + esc(ans.rsvp) + '</div>' +
      '</div>' +
      '<div class="back-link" id="backLink2">&larr; Search a different name</div>';

    document.getElementById('backLink2').addEventListener('click', function(){
      state.screen = 'search';
      state.selectedGuest = null;
      state.query = '';
      render();
    });
  }

  function renderThankYou(){
    var guest = state.selectedGuest;
    var accepted = state.rsvpChoice === 'accept';
    var heading = accepted ? 'See You There!' : 'You Will Be Missed';
    var msg = accepted
      ? 'Thank you, ' + esc(guest.name) + '. Marianne &amp; Ray are overjoyed that you&rsquo;ll be celebrating with them on their special day.'
      : 'Thank you for letting us know, ' + esc(guest.name) + '. You will be dearly missed, and Marianne &amp; Ray appreciate your well wishes from afar.';

    app.innerHTML =
      '<div class="center-screen">' +
        '<div class="icon">&#10022;</div>' +
        '<h2>' + heading + '</h2>' +
        '<p>' + msg + '</p>' +
        '<div class="prev-answer">RSVP Recorded</div>' +
      '</div>';
  }

  render();
})();
</script>

</body>
</html>
